<style>
:root{--bg:#06101d;--card:#0d2035;--card2:#122a45;--line:#315579;--txt:#f7fbff;--mut:#b7cade;--green:#68e7b5;--yellow:#ffd66b;--red:#ff8b98;--blue:#66b5ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101d,#081423 55%,#06101d);color:var(--txt);font-family:Arial,sans-serif}
header{padding:14px;background:#091726;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:12px;margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;padding:8px;background:#091726;position:sticky;top:65px;z-index:19;border-bottom:1px solid #203d59}.tab,.btn{border:1px solid var(--line);background:#0b1c2f;color:var(--txt);padding:9px 11px;border-radius:10px;white-space:nowrap;cursor:pointer}.tab.on,.btn.primary{background:#1b4c76}
.panel{display:none;padding:12px}.panel.on{display:block}.grid,.portfolio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.portfolio-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:13px;background:var(--card2);display:flex;justify-content:space-between}.body{padding:14px;line-height:1.55}.ticker{font-size:24px;font-weight:800}.score{font-size:20px;color:var(--blue);font-weight:800}.mut{color:var(--mut)}.buy{color:var(--green)}.wait{color:var(--yellow)}.avoid{color:var(--red)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;margin:3px}.kpis,.market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.kpi,.market{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:10px}.kpi b,.market b{display:block;font-size:20px;margin-top:4px}
.levels,.manage-grid,.stats,.indicator-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.lvl,.manage-box,.stat,.indcard{background:#08192c;border:1px solid var(--line);border-radius:9px;padding:8px}.lvl small,.manage-box small,.stat small,.indcard small{display:block;color:var(--mut)}
.holding{background:#091a2d;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}.holding-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.next-action{margin-top:9px;padding:10px;background:#0a2740;border:1px solid #4b7da7;border-radius:10px}.next-action strong{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.reason{margin-top:8px;padding:9px;background:#0a1725;border-right:3px solid var(--blue);border-radius:8px;font-size:14px}.tradeqty{margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#071726}
.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px}.field{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#081827;color:var(--txt)}.analysis{display:grid;grid-template-columns:330px 1fr;gap:10px}.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.chart{height:470px;background:#08192a;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}.check{display:flex;align-items:center;gap:6px;background:#08192c;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px}.presets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.preset{font-size:12px;padding:7px 9px}
.rr-overlay{position:absolute;left:0;right:0;pointer-events:none;z-index:4}.rr-profit{background:rgba(67,153,255,.20);border-top:1px solid rgba(102,181,255,.75);border-bottom:1px solid rgba(102,181,255,.75)}.rr-risk{background:rgba(255,78,98,.18);border-top:1px solid rgba(255,139,152,.75);border-bottom:1px solid rgba(255,139,152,.75)}.rr-entry-line{position:absolute;left:0;right:0;height:2px;background:#ffd66b;z-index:5;pointer-events:none}.rr-badge{position:absolute;left:8px;z-index:6;background:#071726;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;pointer-events:none}.rr-panel{margin-top:10px;background:#091a2d;border:1px solid var(--line);border-radius:12px;padding:10px}.rr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.rr-ok{color:var(--green);font-weight:800}.rr-no{color:var(--red);font-weight:800}.note,.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}.action-center{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bucket{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px}.analysis-summary{margin-top:10px}.analysis-summary b{font-size:17px}.status-banner{padding:10px;border-radius:10px;border:1px solid var(--line);margin-top:8px;background:#08192c}.status-banner.good{border-color:#2d8664}.status-banner.bad{border-color:#8b3946}.status-banner.mid{border-color:#886e2e}.momentum-frame{width:100%;height:calc(100vh - 135px);min-height:700px;border:1px solid var(--line);border-radius:14px;background:#06101d}
@media(max-width:760px){.grid,.portfolio-grid,.analysis{grid-template-columns:1fr}.kpis,.market-grid{grid-template-columns:repeat(2,1fr)}.action-center{grid-template-columns:1fr}.chart{height:370px}h1{font-size:20px}.body{font-size:16px}.holding-top{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.checks{grid-template-columns:1fr 1fr}.momentum-frame{height:calc(100vh - 150px);min-height:650px}}

<body>
<header><h1>Stock Command Center v6</h1><div class="sub">Live Quotes · Portfolios · Recommendations · Graph Analysis · Momentum Rotation</div></header>
<nav>
<button class="tab on" data-p="dash">דשבורד</button>
<button class="tab" data-p="portfolio">2 התיקים שלי</button>
<button class="tab" data-p="recs">הזדמנויות חדשות</button>

</nav>
<main>
<section id="dash" class="panel on"><div id="market" class="market-grid"></div><div class="kpis"><div class="kpi">Market Risk<b id="risk">—</b></div><div class="kpi">אחזקות<b id="count">—</b></div><div class="kpi">Watchlist<b id="buycount">—</b></div><div class="kpi">מחירים<b id="live">טוען</b></div></div><div class="card"><div class="body"><b>Market View</b><div id="marketText" class="mut">טוען נתוני שוק...</div></div></div></section>
<section id="portfolio" class="panel"><div class="card"><div class="body"><h2>הפוזיציות שלי</h2><div class="mut">שני התיקים נשמרים בנפרד.</div></div></div><div class="portfolio-grid" style="margin-top:10px"><div class="portfolio-card"><div class="body"><h2>תיק 1</h2><div id="pf1"></div></div></div><div class="portfolio-card"><div class="body"><h2>תיק 2</h2><div id="pf2"></div></div></div></div></section>
<section id="recs" class="panel"><div class="toolbar"><input id="q" class="field" placeholder="חיפוש מניה"><select id="f" class="field"><option value="">הכול</option><option value="buy">Buy</option><option value="wait">Wait</option><option value="avoid">Avoid</option></select></div><div id="cards" class="grid"></div></section>
<section id="analysis" class="panel"><div class="analysis"><div class="side"><h2>Stock Analysis</h2><input id="symbol" class="field" value="NVDA"><button id="load" class="btn primary" style="width:100%;margin-top:7px">פתח ניתוח</button><div class="presets"><button class="btn preset" data-preset="basic">Basic</button><button class="btn preset" data-preset="swing">Swing</button><button class="btn preset" data-preset="full">Full Analysis</button></div><div class="checks" id="checks"></div><label class="mut" for="riskBudget">סיכון מקסימלי לעסקה ($)</label><input id="riskBudget" class="field" type="number" value="150" min="25" step="25"><div id="ainfo" class="note">—</div><div id="rrinfo" class="rr-panel">טען מניה לקבלת Risk/Reward.</div></div><div><div id="chart" class="chart"></div><div id="tech" class="grid" style="margin-top:10px"></div><div id="indicatorSummary" class="indicator-grid"></div><div id="decision" class="analysis-summary"></div></div></div></section>
<section id="actions" class="panel"><div id="actionCenter" class="action-center"></div></section>
<section id="momentum" class="panel"><iframe class="momentum-frame" src="/v6.html" title="Momentum v6"></iframe></section>
</main>
<script>
const WATCH=[['SOFI','SoFi','buy',88,'Fintech reversal'],['VRT','Vertiv','wait',89,'AI power/cooling reversal'],['ZETA','Zeta Global','wait',91,'Growth repricing'],['ALAB','Astera Labs','wait',88,'AI connectivity'],['NVT','nVent','wait',86,'Liquid cooling'],['NBIS','Nebius','wait',84,'AI cloud high beta'],['AMAT','Applied Materials','wait',84,'Quality chip dip'],['CRDO','Credo','wait',80,'Wait for reclaim'],['AVT','Avnet','wait',82,'Earnings acceleration'],['OKLO','Oklo','wait',79,'High-risk nuclear'],['HOOD','Robinhood','wait',76,'Fintech/crypto beta'],['META','Meta','wait',82,'Watch support']];
const PF1=[['NOK',200,12.20],['ETHA',170,14.22],['IREN',70,36.56],['PURR',500,7.97],['GOOG',10,366.24],['SNDK',1,1260.47],['MRVL',30,224.00],['MU',4,887.12],['ORCL',25,133.84],['ETHU',100,19.41]];
const PF2=[['AVGO',15,408.78],['MSTR',79,106.76],['NVDA',75,207.38],['BMNR',210,19.41],['ONDS',300,9.07]];
const P={}; const $=id=>document.getElementById(id); const fmt=n=>n==null||!Number.isFinite(Number(n))?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const ownSet=()=>new Set([...PF1,...PF2].map(x=>x[0]));
function pnl(p,avg){return Number.isFinite(p)&&avg?((p-avg)/avg*100):null} function cashPnl(p,avg,q){return Number.isFinite(p)&&avg?(p-avg)*q:null}
function holding([s,q,avg]){const p=P[s]?.livePrice??P[s]?.price,pp=pnl(p,avg),cp=cashPnl(p,avg,q);return `<div class="holding"><div class="holding-top"><div><b style="font-size:21px">${s} × ${q}</b><div class="mut">ממוצע שלך: ${fmt(avg)}</div></div><span class="pill ${pp==null?'wait':pp>=0?'buy':'avoid'}">${pp==null?'WAIT':pp>=0?'PROFIT':'LOSS'}</span></div><div class="stats"><div class="stat"><small>מחיר חי</small><b>${fmt(p)}</b></div><div class="stat"><small>רווח / הפסד</small><b class="${pp>=0?'buy':'avoid'}">${pp==null?'—':(pp>=0?'+':'')+pp.toFixed(2)+'%'}</b></div><div class="stat"><small>P/L בדולר</small><b class="${cp>=0?'buy':'avoid'}">${cp==null?'—':(cp>=0?'+':'')+fmt(cp)}</b></div><div class="stat"><small>שווי פוזיציה</small><b>${p?fmt(p*q):'—'}</b></div></div><button class="btn" style="margin-top:8px" onclick="openAnalysis('${s}')">ניתוח מלא</button></div>`}
function portfolios(){$('pf1').innerHTML=PF1.map(holding).join('');$('pf2').innerHTML=PF2.map(holding).join('');$('count').textContent=PF1.length+PF2.length}
function cards(){const q=$('q').value.toUpperCase(),f=$('f').value,own=ownSet();const rows=WATCH.filter(r=>!own.has(r[0])&&(!q||(r[0]+r[1]).toUpperCase().includes(q))&&(!f||r[2]===f));$('cards').innerHTML=rows.map(r=>`<div class="card"><div class="head"><div><div class="ticker">${r[0]}</div><div class="mut">${r[1]}</div><span class="pill ${r[2]==='buy'?'buy':'wait'}">${r[2].toUpperCase()}</span></div><div class="score">${r[3]}/100</div></div><div class="body">${r[4]}<br><button class="btn" onclick="openAnalysis('${r[0]}')">גרף + ניתוח דינמי</button></div></div>`).join('')}
async function prices(){try{const sy=[...new Set([...PF1,...PF2].map(x=>x[0]).concat(WATCH.map(x=>x[0]),['SPY','QQQ','BTC-USD','ETH-USD','SOL-USD']))].join(',');const j=await fetch('/api/quotes?symbols='+encodeURIComponent(sy),{cache:'no-store'}).then(r=>r.json());(j.quotes||[]).forEach(x=>P[x.symbol]=x);$('live').textContent='LIVE';render()}catch(e){$('live').textContent='שגיאה'}}
function market(){const a=[['S&P 500','SPY'],['Nasdaq','QQQ'],['Bitcoin','BTC-USD'],['Ethereum','ETH-USD']];$('market').innerHTML=a.map(([n,s])=>`<div class="market"><span class="mut">${n}</span><b>${fmt(P[s]?.livePrice??P[s]?.price)}</b><span class="${(P[s]?.changePercent||0)>=0?'buy':'avoid'}">${P[s]?.changePercent!=null?P[s].changePercent.toFixed(2)+'%':'—'}</span></div>`).join('');const moves=a.map(([,s])=>P[s]?.changePercent).filter(Number.isFinite);let risk=50+moves.reduce((a,v)=>a+(v>1?10:v< -1?-10:v>0?5:-5),0);risk=Math.max(0,Math.min(100,risk));$('risk').textContent=risk;$('buycount').textContent=WATCH.length;$('marketText').textContent=`Risk Score ${risk}/100. BTC ${fmt(P['BTC-USD']?.livePrice??P['BTC-USD']?.price)} · ETH ${fmt(P['ETH-USD']?.livePrice??P['ETH-USD']?.price)} · SOL ${fmt(P['SOL-USD']?.livePrice??P['SOL-USD']?.price)}`}
function actions(){const groups={'רווחיות':[],'דורש בדיקה':[],'Watchlist':[]};[...PF1,...PF2].forEach(x=>{const pp=pnl(P[x[0]]?.livePrice??P[x[0]]?.price,x[2]);groups[pp!=null&&pp>=8?'רווחיות':'דורש בדיקה'].push([x[0],pp])});WATCH.slice(0,6).forEach(x=>groups['Watchlist'].push([x[0],null]));$('actionCenter').innerHTML=Object.entries(groups).map(([k,v])=>`<div class="bucket"><b>${k}</b>${v.map(([s,p])=>`<div class="row"><b>${s}</b>${p!=null?`<br><span class="${p>=0?'buy':'avoid'}">${p.toFixed(2)}%</span>`:''}<br><button class="btn" onclick="openAnalysis('${s}')">נתח</button></div>`).join('')}</div>`).join('')}
function render(){portfolios();cards();actions();market()}
const IND={sma50:'SMA 50',sma200:'SMA 200',ema20:'EMA 20',ema50:'EMA 50',bb:'Bollinger Bands',fib:'Fibonacci',rsi:'RSI',macd:'MACD',volume:'Volume',rr:'Risk/Reward',pos:'Position Size'};
const active={sma50:true,sma200:true,ema20:false,ema50:false,bb:false,fib:true,rsi:true,macd:true,volume:true,rr:true,pos:true};
function buildChecks(){$('checks').innerHTML=Object.entries(IND).map(([k,n])=>`<label class="check"><input type="checkbox" data-ind="${k}" ${active[k]?'checked':''}>${n}</label>`).join('');$('checks').querySelectorAll('input').forEach(x=>x.onchange=()=>{active[x.dataset.ind]=x.checked;if(lastCandles.length)renderTechnical(lastSymbol,lastCandles)})}
function preset(name){Object.keys(active).forEach(k=>active[k]=false);if(name==='basic'){['sma50','sma200','volume','rr','pos'].forEach(k=>active[k]=true)}else if(name==='swing'){['sma50','ema20','ema50','bb','fib','rsi','macd','volume','rr','pos'].forEach(k=>active[k]=true)}else Object.keys(active).forEach(k=>active[k]=true);buildChecks();if(lastCandles.length)renderTechnical(lastSymbol,lastCandles)}
function SMA(vals,n){return vals.map((_,i)=>i<n-1?null:vals.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n)}
function EMA(vals,n){const k=2/(n+1);let e=null;return vals.map((v,i)=>{e=e==null?v:v*k+e*(1-k);return i<n-1?null:e})}
function STD(arr){const m=arr.reduce((a,b)=>a+b,0)/arr.length;return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length)}
function RSI(vals,n=14){let gains=0,loss=0,out=Array(vals.length).fill(null);for(let i=1;i<=n&&i<vals.length;i++){const d=vals[i]-vals[i-1];if(d>=0)gains+=d;else loss-=d}let ag=gains/n,al=loss/n;if(vals.length>n)out[n]=100-(100/(1+(ag/(al||1e-9))));for(let i=n+1;i<vals.length;i++){const d=vals[i]-vals[i-1],g=Math.max(d,0),l=Math.max(-d,0);ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;out[i]=100-(100/(1+(ag/(al||1e-9))))}return out}
function ATR(c,n=14){const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);return SMA(tr,n)}
function MACD(vals){const e12=EMA(vals,12),e26=EMA(vals,26),m=vals.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null);const clean=m.map(v=>v??0),sig=EMA(clean,9);return {m,signal:sig,hist:m.map((v,i)=>v==null?null:v-sig[i])}}
function dynamicPlan(c){const last=c.at(-1),atr=ATR(c,14).at(-1)||last.close*.04;const look=c.slice(-20),support=Math.min(...look.map(x=>x.low)),resistance=Math.max(...look.slice(0,-1).map(x=>x.high));const entry=last.close;const sl=Math.max(support,entry-1.5*atr);let t1=Math.max(resistance,entry+2*(entry-sl));let t2=entry+3*(entry-sl);if(t2<t1)t2=t1+(entry-sl);return {entry,sl,t1,t2,atr,support,resistance}}
function scoreAnalysis(c,plan){const cl=c.map(x=>x.close),last=cl.at(-1),s50=SMA(cl,50).at(-1),s200=SMA(cl,200).at(-1),rsi=RSI(cl).at(-1),macd=MACD(cl),mh=macd.hist.at(-1);let score=50,reasons=[];if(s50&&last>s50){score+=10;reasons.push('מעל SMA50')}else{score-=7;reasons.push('מתחת SMA50')}if(s200&&last>s200){score+=10;reasons.push('מעל SMA200')}else if(s200){score-=8;reasons.push('מתחת SMA200')}if(rsi!=null&&rsi>=50&&rsi<=70){score+=10;reasons.push('RSI חיובי')}else if(rsi>75){score-=8;reasons.push('RSI מתוח')}else if(rsi<35){score+=3;reasons.push('RSI oversold')}if(mh>0){score+=8;reasons.push('MACD חיובי')}else score-=5;const rr=(plan.t2-plan.entry)/(plan.entry-plan.sl);if(rr>=2){score+=10;reasons.push('R:R מעל 1:2')}else{score-=15;reasons.push('R:R חלש')}return {score:Math.max(0,Math.min(100,score)),reasons,rsi,macdHist:mh,s50,s200,rr}}
let chart,priceSeries,overlaySeries=[],priceLines=[],lastCandles=[],lastSymbol='NVDA';
function cleanupChart(){if(chart){chart.remove();chart=null}overlaySeries=[];priceLines=[];document.querySelectorAll('#chart .rr-overlay,#chart .rr-entry-line,#chart .rr-badge').forEach(x=>x.remove())}
function lineData(c,arr){return c.map((x,i)=>arr[i]==null?null:{time:x.time,value:arr[i]}).filter(Boolean)}
function addLine(arr,c,title){const s=chart.addLineSeries({lineWidth:2,title});s.setData(lineData(c,arr));overlaySeries.push(s);return s}
function drawRR(plan){document.querySelectorAll('#chart .rr-overlay,#chart .rr-entry-line,#chart .rr-badge').forEach(x=>x.remove());if(!active.rr||!priceSeries)return;const host=$('chart'),yt=priceSeries.priceToCoordinate(plan.t2),ye=priceSeries.priceToCoordinate(plan.entry),ys=priceSeries.priceToCoordinate(plan.sl);if([yt,ye,ys].some(v=>v==null||!isFinite(v)))return;const p=document.createElement('div');p.className='rr-overlay rr-profit';p.style.top=Math.min(yt,ye)+'px';p.style.height=Math.max(2,Math.abs(ye-yt))+'px';host.appendChild(p);const r=document.createElement('div');r.className='rr-overlay rr-risk';r.style.top=Math.min(ye,ys)+'px';r.style.height=Math.max(2,Math.abs(ys-ye))+'px';host.appendChild(r);const l=document.createElement('div');l.className='rr-entry-line';l.style.top=ye+'px';host.appendChild(l);[[plan.t2,yt,'T2 '+fmt(plan.t2)],[plan.entry,ye,'Entry '+fmt(plan.entry)],[plan.sl,ys,'SL '+fmt(plan.sl)]].forEach(([v,y,t])=>{const b=document.createElement('div');b.className='rr-badge';b.style.top=Math.max(2,y-14)+'px';b.textContent=t;host.appendChild(b)})}
function renderTechnical(sym,c){lastCandles=c;lastSymbol=sym;cleanupChart();chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#08192a'},textColor:'#b7cade'},grid:{vertLines:{color:'#122b43'},horzLines:{color:'#122b43'}},rightPriceScale:{borderColor:'#315579'},timeScale:{borderColor:'#315579'}});priceSeries=chart.addCandlestickSeries({upColor:'#68e7b5',downColor:'#ff8b98',borderVisible:false,wickUpColor:'#68e7b5',wickDownColor:'#ff8b98'});priceSeries.setData(c.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));const cl=c.map(x=>x.close);if(active.sma50)addLine(SMA(cl,50),c,'SMA50');if(active.sma200)addLine(SMA(cl,200),c,'SMA200');if(active.ema20)addLine(EMA(cl,20),c,'EMA20');if(active.ema50)addLine(EMA(cl,50),c,'EMA50');if(active.bb){const m=SMA(cl,20),up=cl.map((_,i)=>i<19?null:m[i]+2*STD(cl.slice(i-19,i+1))),lo=cl.map((_,i)=>i<19?null:m[i]-2*STD(cl.slice(i-19,i+1)));addLine(up,c,'BB Upper');addLine(lo,c,'BB Lower')}if(active.volume){const v=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});v.priceScale().applyOptions({scaleMargins:{top:.78,bottom:0}});v.setData(c.map(x=>({time:x.time,value:x.volume||0,color:x.close>=x.open?'rgba(104,231,181,.45)':'rgba(255,139,152,.45)'})));overlaySeries.push(v)}const plan=dynamicPlan(c);if(active.fib){const hi=Math.max(...c.slice(-60).map(x=>x.high)),lo=Math.min(...c.slice(-60).map(x=>x.low));[.236,.382,.5,.618,.786].forEach(f=>{const price=hi-(hi-lo)*f;const pl=priceSeries.createPriceLine({price,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Fib '+f});priceLines.push(pl)})}chart.timeScale().fitContent();const analysis=scoreAnalysis(c,plan);renderPanels(sym,c,plan,analysis);setTimeout(()=>drawRR(plan),80);chart.timeScale().subscribeVisibleLogicalRangeChange(()=>setTimeout(()=>drawRR(plan),0))}
function renderPanels(sym,c,plan,a){const last=c.at(-1).close;$('ainfo').innerHTML=`<b>${sym}</b><br>מחיר אחרון: ${fmt(last)}<br>${c.length} נרות · ATR14 ${fmt(plan.atr)}`;const risk=plan.entry-plan.sl,rr1=(plan.t1-plan.entry)/risk,rr2=(plan.t2-plan.entry)/risk,budget=Math.max(0,Number($('riskBudget').value||150)),qty=Math.max(0,Math.floor(budget/risk));$('rrinfo').innerHTML=active.rr?`<b>Risk / Reward דינמי</b><div class="rr-grid"><div class="stat"><small>Entry</small><b>${fmt(plan.entry)}</b></div><div class="stat"><small>SL</small><b class="avoid">${fmt(plan.sl)}</b></div><div class="stat"><small>T1</small><b class="buy">${fmt(plan.t1)}</b></div><div class="stat"><small>T2</small><b class="buy">${fmt(plan.t2)}</b></div><div class="stat"><small>R:R T1</small><b>1:${rr1.toFixed(2)}</b></div><div class="stat"><small>R:R T2</small><b>1:${rr2.toFixed(2)}</b></div></div>${active.pos?`<div class="tradeqty"><b>Position Size:</b> ${qty} מניות · שווי ${fmt(qty*plan.entry)} · לפי סיכון של ${fmt(budget)}</div>`:''}`:'Risk/Reward כבוי';$('tech').innerHTML=`<div class="card"><div class="body"><b>Dynamic AI Score</b><div class="score">${a.score}/100</div></div></div><div class="card"><div class="body"><b>רמות דינמיות</b><br>Support ${fmt(plan.support)}<br>Resistance ${fmt(plan.resistance)}<br>SL ${fmt(plan.sl)}<br>T1 ${fmt(plan.t1)}<br>T2 ${fmt(plan.t2)}</div></div>`;const items=[];if(active.sma50)items.push(['SMA50',a.s50,last>a.s50?'מעל':'מתחת']);if(active.sma200)items.push(['SMA200',a.s200,last>a.s200?'מעל':'מתחת']);if(active.rsi)items.push(['RSI14',a.rsi,a.rsi>70?'מתוח':a.rsi<35?'Oversold':'ניטרלי/חיובי']);if(active.macd)items.push(['MACD Hist',a.macdHist,a.macdHist>0?'חיובי':'שלילי']);items.push(['R:R T2',a.rr,a.rr>=2?'תקין':'חלש']);$('indicatorSummary').innerHTML=items.map(([n,v,t])=>`<div class="indcard"><small>${n}</small><b>${typeof v==='number'?v.toFixed(2):'—'}</b><div class="mut">${t}</div></div>`).join('');const cls=a.score>=75&&a.rr>=2?'good':a.score<55||a.rr<1.5?'bad':'mid';const label=cls==='good'?'✅ ENTRY QUALITY':cls==='bad'?'❌ NO ENTRY':'🟡 WAIT / CONFIRM';$('decision').innerHTML=`<div class="status-banner ${cls}"><b>${label}</b><br>Score ${a.score}/100 · ${a.reasons.join(' · ')}</div>`}
async function loadAnalysis(sym){sym=(sym||$('symbol').value||'NVDA').trim().toUpperCase();$('symbol').value=sym;$('ainfo').textContent='טוען...';try{const r=await fetch('/api/history?symbol='+encodeURIComponent(sym)+'&range=6mo&interval=1d',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.candles?.length)throw new Error(j.error||'no data');renderTechnical(sym,j.candles)}catch(e){cleanupChart();$('ainfo').innerHTML=`<span class="avoid">שגיאה בטעינת ${sym}</span><br><span class="mut">${e.message}</span>`;$('rrinfo').textContent='Risk/Reward לא זמין.'}}
function openAnalysis(s){show('analysis');loadAnalysis(s)}
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('nav .tab').forEach(x=>x.classList.toggle('on',x.dataset.p===id))}
document.querySelectorAll('nav .tab').forEach(b=>b.onclick=()=>show(b.dataset.p));$('q').oninput=cards;$('f').onchange=cards;$('load').onclick=()=>loadAnalysis();$('riskBudget').oninput=()=>{if(lastCandles.length)renderTechnical(lastSymbol,lastCandles)};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));buildChecks();render();prices();setInterval(prices,30000);
</script>
</body>
