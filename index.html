<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Command Center v6</title><style>:root{--bg:#06101d;--card:#0d2035;--line:#315579;--txt:#f7fbff;--mut:#b7cade;--g:#68e7b5;--y:#ffd66b;--r:#ff8b98;--b:#66b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}header{padding:14px;position:sticky;top:0;z-index:5;background:#091726;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0 0 6px}.mut{color:var(--mut)}main{max-width:1200px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn,.field{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0a2740;color:var(--txt)}.btn{cursor:pointer}.btn.primary{background:#17456d}.btn:disabled{opacity:.55}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px}.buy{color:var(--g)}.wait{color:var(--y)}.avoid{color:var(--r)}.score{font-size:25px;color:var(--b);font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.tab{border:1px solid var(--line);background:#081827;color:var(--txt);padding:7px 10px;border-radius:999px;cursor:pointer}.tab.active{background:#17456d}.portfolio{display:none}.portfolio.active{display:block}.holding,.scanrow{display:grid;grid-template-columns:1fr repeat(4,auto);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #23415f}.holding:last-child,.scanrow:last-child{border:0}.ticker{font-weight:800}.hot{border-color:#2d8664}.guard{border-color:#8b3946}.status{font-size:13px}.leader{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#081827}.trade{border-color:#2d8664}.k{background:#081827;border-radius:9px;padding:8px}.k small{display:block;color:var(--mut)}.fresh{font-size:12px;color:var(--mut);margin-top:5px}@media(max-width:760px){.grid,.actions{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.holding,.scanrow{grid-template-columns:1fr 1fr}.ticker{grid-column:1/-1}}</style></head><body><header><h1>Stock Command Center v6</h1><div class="mut">Momentum Rotation · Pre/Regular/After · A/A+ · Hard SL · Trailing SL</div></header><main>
<div class="actions"><button id="refresh" class="btn primary">↻ רענון כל הנתונים</button><button id="scan" class="btn">⚡ סריקת Nasdaq + NYSE</button></div><div id="global" class="card">מוכן. רענון = מחירים חיים/Extended Hours. סריקה = כל שוק Nasdaq/NYSE דרך screener ואז בדיקה עמוקה ל-Top 2.</div>
<div id="marketScan"></div><div id="top2"></div>
<div class="card"><h3>התיקים שלי</h3><div class="tabs"><button class="tab active" data-p="p1">תיק 1</button><button class="tab" data-p="p2">תיק 2</button></div><div id="p1" class="portfolio active"><div class="mut">מזומן לפי הצילום: ~$14.3K</div><div id="p1rows"></div></div><div id="p2" class="portfolio"><div id="p2rows"></div></div></div>
<div class="card"><div class="grid"><input id="symbol" class="field" value="MSTR" placeholder="Ticker"><button id="analyze" class="btn primary">נתח מניה</button></div><div id="analysisStatus" class="fresh"></div></div><div id="result"></div><div id="trades"></div>
</main><script>
const portfolios={p1:[['SNDK',1260.47],['SOFI',18.45],['NOK',12.20],['ETHU',19.43],['ETHA',14.22],['IREN',36.56],['GOOG',366.24],['ORCL',137.23],['MU',929.58],['PURR',7.97],['MRVL',224]],p2:[['AVGO',408.78],['NVDA',207.38],['MSTR',106.68],['BMNR',19.41],['ONDS',9.07]]};const Q={};let current=null;const $=x=>document.getElementById(x),fmt=n=>Number.isFinite(n)?'$'+Number(n).toFixed(2):'—',pct=n=>Number.isFinite(n)?Number(n).toFixed(2)+'%':'—';const phase=p=>p==='pre'?'PRE':p==='post'?'AFTER':p==='regular'?'REGULAR':'EXT';
function SMA(v,n){return v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n)}function EMA(v,n){const k=2/(n+1);let e=null;return v.map((x,i)=>{e=e==null?x:x*k+e*(1-k);return i<n-1?null:e})}function RSI(v,n=14){let g=0,l=0,o=Array(v.length).fill(null);for(let i=1;i<=n&&i<v.length;i++){let d=v[i]-v[i-1];d>=0?g+=d:l-=d}let ag=g/n,al=l/n;for(let i=n;i<v.length;i++){if(i>n){let d=v[i]-v[i-1];ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n}o[i]=100-100/(1+ag/(al||1e-9))}return o}function ATR(c,n=14){const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);return SMA(tr,n)}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
async function quotes(sy){let out=[];for(let i=0;i<sy.length;i+=45){const r=await fetch('/api/quotes?symbols='+encodeURIComponent(sy.slice(i,i+45).join(',')),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'quotes');out=out.concat(j.quotes||[])}out.forEach(q=>Q[q.symbol]=q);return out}async function hist(s,range,interval){const r=await fetch(`/api/history?symbol=${encodeURIComponent(s)}&range=${range}&interval=${interval}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.candles?.length)throw Error(j.error||'history');return j.candles}
function allHoldings(){return [...new Set([...portfolios.p1,...portfolios.p2].map(x=>x[0]))]}function drawPortfolios(){for(const id of ['p1','p2']){$(id+'rows').innerHTML=portfolios[id].map(([s,a])=>{const q=Q[s],p=q?.livePrice??q?.price,pl=Number.isFinite(p)?(p-a)/a*100:null;return `<div class="holding"><span class="ticker">${s}</span><span>ממוצע ${fmt(a)}</span><span>${fmt(p)} ${q?`<span class="pill">${phase(q.phase)}</span>`:''}</span><span class="${pl>=0?'buy':'avoid'}">${pct(pl)}</span><button class="tab quick" data-s="${s}">נתח</button></div>`}).join('')}document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>deepAnalyze(b.dataset.s,true))}
async function refresh(){const b=$('refresh');b.disabled=true;$('global').textContent='מרענן מחירים...';try{await quotes(allHoldings().concat(['BTC-USD','ETH-USD']));drawPortfolios();const bt=Q['BTC-USD'],et=Q['ETH-USD'];$('global').innerHTML=`עודכן ${new Date().toLocaleTimeString('he-IL')} · BTC ${fmt(bt?.livePrice??bt?.price)} ${pct(bt?.changePercent)} · ETH ${fmt(et?.livePrice??et?.price)} ${pct(et?.changePercent)}<div class="fresh">Yahoo Finance לא-רשמי; Extended Hours כשזמין.</div>`;updateTracked()}catch(e){$('global').innerHTML=`<span class="avoid">רענון נכשל: ${e.message}</span>`}finally{b.disabled=false}}
function classify(c,w,live){const cl=c.map(x=>x.close),p=Number.isFinite(live?.livePrice)?live.livePrice:c.at(-1).close,atr=ATR(c).at(-1)||p*.04,s20=SMA(cl,20).at(-1),s50=SMA(cl,50).at(-1),s150=SMA(cl,150).at(-1),s200=SMA(cl,200).at(-1),rsi=RSI(cl).at(-1),res=Math.max(...c.slice(-61,-1).map(x=>x.high)),sup20=Math.min(...c.slice(-20).map(x=>x.low)),rv=avg(c.slice(-21,-1).map(x=>x.volume||0))?c.at(-1).volume/avg(c.slice(-21,-1).map(x=>x.volume||0)):null,wc=w.map(x=>x.close),w20=SMA(wc,20).at(-1),w50=SMA(wc,50).at(-1),wp=w.at(-1).close;const overhead=[['SMA20',s20],['SMA50',s50],['SMA150',s150],['SMA200',s200],['60D High',res]].filter(([,v])=>Number.isFinite(v)&&v>p).map(([n,v])=>({n,v,d:(v-p)/p*100})).sort((a,b)=>a.d-b.d),blocker=overhead.find(x=>x.d<=3);let score=42,reasons=[];for(const m of [s20,s50,s150,s200])if(m&&p>m)score+=7;if(rsi>=50&&rsi<=72){score+=9;reasons.push('RSI חיובי')}if(rsi>78){score-=10;reasons.push('RSI מתוח')}if(rv>=1.25){score+=9;reasons.push('Volume מאשר')}if(w20&&wp>w20){score+=7;reasons.push('שבועי חיובי')}if(w50&&wp>w50)score+=5;const breakout=p>res;if(breakout){score+=12;reasons.push('פריצת 60D')}if(blocker){score-=24;reasons.push(`חסם ${blocker.n} ${blocker.d.toFixed(1)}% מעל`)}score=Math.max(0,Math.min(100,score));let grade='B',action='WAIT';if(score>=82&&!blocker&&(breakout||p>s20&&p>s50)){grade='A+';action=live?.phase==='pre'?'PRE-MARKET A+':'A+'}else if(score>=68&&!blocker){grade='A';action='A WATCH'}const trigger=Math.max(res,(s20||0),(s50||0))*1.002,workLow=Math.max(s20||0,s50||0,res-0.7*atr),workHigh=Math.max(workLow,Math.min(trigger,p+0.25*atr)),early=Math.max(workLow,trigger-0.35*atr),initial=Math.max(sup20-0.2*atr,p-2*atr),trail=Math.max(Math.min(...c.slice(-5).map(x=>x.low))-0.15*atr,p-1.55*atr);return {p,atr,s20,s50,s150,s200,rsi,rv,res,sup20,w20,w50,blocker,score,reasons,grade,action,trigger,workLow,workHigh,early,initial,trail,phase:live?.phase||'regular'}}
async function deepAnalyze(s,scroll=false){s=s.toUpperCase();$('symbol').value=s;$('analysisStatus').textContent='טוען יומי + שבועי + מחיר Extended...';try{await quotes([s]);const [d,w]=await Promise.all([hist(s,'2y','1d'),hist(s,'5y','1wk')]);const a=classify(d,w,Q[s]);current={s,a};renderAnalysis(s,a);$('analysisStatus').textContent=`עודכן ${new Date().toLocaleTimeString('he-IL')} · ${phase(a.phase)}`;if(scroll)window.scrollTo({top:$('result').offsetTop-80,behavior:'smooth'});return a}catch(e){$('analysisStatus').innerHTML=`<span class="avoid">שגיאה: ${e.message}</span>`}}
function renderAnalysis(s,a){const cls=a.grade==='A+'?'buy':a.grade==='A'?'wait':'avoid',guard=a.blocker?`<div class="card guard"><b class="avoid">⛔ חסם מעל המחיר</b><div>${a.blocker.n} ${fmt(a.blocker.v)} (${pct(a.blocker.d)} מעל). אין A+ לפני פריצה/החזקה.</div></div>`:'';$('result').innerHTML=`<div class="grid"><div class="card"><div class="row"><div><h2>${s}</h2><div>${fmt(a.p)} <span class="pill">${phase(a.phase)}</span></div></div><div><div class="score">${a.score}/100</div><b class="${cls}">${a.action}</b></div></div><div class="fresh">${a.reasons.join(' · ')||'אין מספיק אישורים'}</div></div>${guard||`<div class="card hot"><b class="buy">אין חסם MA/שיא עד 3% מעל המחיר</b></div>`}</div><div class="metrics"><div class="k"><small>אזור עבודה A</small><b>${fmt(a.workLow)}–${fmt(a.workHigh)}</b></div><div class="k"><small>כניסה מוקדמת</small><b>${fmt(a.early)}</b></div><div class="k"><small>Trigger ל-A+</small><b>${fmt(a.trigger)}</b></div><div class="k"><small>Hard SL ראשוני</small><b class="avoid">${fmt(a.initial)}</b></div><div class="k"><small>Trailing SL מועמד</small><b class="buy">${fmt(a.trail)}</b></div><div class="k"><small>RSI / RVOL</small><b>${a.rsi?.toFixed(1)||'—'} / ${a.rv?.toFixed(2)||'—'}x</b></div><div class="k"><small>SMA150 / 200</small><b>${fmt(a.s150)} / ${fmt(a.s200)}</b></div><div class="k"><small>60D Resistance</small><b>${fmt(a.res)}</b></div></div><div class="card"><button id="track" class="btn primary">▶ התחל/עדכן מעקב עסקה</button><div class="fresh">המעקב שומר Entry, שיא מאז הכניסה ו-Trailing SL שאינו יורד.</div></div>`;$('track').onclick=()=>startTrack(s,a)}
function getTrades(){try{return JSON.parse(localStorage.getItem('v6trades')||'{}')}catch{return {}}}function saveTrades(t){localStorage.setItem('v6trades',JSON.stringify(t))}function startTrack(s,a){const t=getTrades(),old=t[s];t[s]={entry:old?.entry||a.p,high:Math.max(old?.high||a.p,a.p),initial:old?.initial||a.initial,trail:Math.max(old?.trail||a.initial,a.trail),updated:Date.now()};saveTrades(t);drawTrades()}function updateTracked(){const t=getTrades();for(const [s,x] of Object.entries(t)){const p=Q[s]?.livePrice??Q[s]?.price;if(Number.isFinite(p)){x.high=Math.max(x.high||p,p);x.updated=Date.now()}}saveTrades(t);drawTrades()}function drawTrades(){const t=getTrades(),rows=Object.entries(t);$('trades').innerHTML=rows.length?`<div class="card trade"><h3>עסקאות במעקב</h3>${rows.map(([s,x])=>{const p=Q[s]?.livePrice??Q[s]?.price,pl=Number.isFinite(p)?(p-x.entry)/x.entry*100:null;return `<div class="holding"><span class="ticker">${s}</span><span>Entry ${fmt(x.entry)}</span><span>High ${fmt(x.high)}</span><span>Trail ${fmt(x.trail)}</span><span class="${pl>=0?'buy':'avoid'}">${pct(pl)}</span></div>`}).join('')}</div>`:''}
async function scanMarket(){const b=$('scan');b.disabled=true;$('global').textContent='סורק Nasdaq + NYSE...';try{const r=await fetch('/api/market-scan',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'scan');const secs=j.sectors||[];$('marketScan').innerHTML=`<div class="card"><h3>🔥 סקטורים חמים — ${j.universeCount||0} מניות נסרקו</h3>${secs.slice(0,8).map((x,i)=>`<div class="scanrow"><b>#${i+1} ${x.sector}</b><span>Avg ${pct(x.avgChange)}</span><span>Breadth ${x.breadth?.toFixed(0)}%</span><span class="${x.avgChange>=0?'buy':'avoid'}">Score ${x.score?.toFixed(2)}</span><span>${(x.leaders||[]).slice(0,2).map(z=>z.symbol).join(' / ')}</span></div>`).join('')}<div class="fresh">מקור סריקת universe: Nasdaq stock screener API.</div></div>`;const hot=secs[0];if(!hot)throw Error('no sectors');const cand=(hot.leaders||[]).slice(0,6);await quotes(cand.map(x=>x.symbol));const enriched=[];for(const x of cand.slice(0,4)){try{const [d,w]=await Promise.all([hist(x.symbol,'2y','1d'),hist(x.symbol,'5y','1wk')]);enriched.push({x,a:classify(d,w,Q[x.symbol])})}catch{}}enriched.sort((a,b)=>b.a.score-a.a.score);const top=enriched.slice(0,2);$('top2').innerHTML=`<div class="card hot"><h3>🏆 Top 2 בסקטור #1: ${hot.sector}</h3>${top.map((z,i)=>`<div class="leader"><div class="row"><b>#${i+1} ${z.x.symbol}</b><span class="${z.a.grade==='A+'?'buy':z.a.grade==='A'?'wait':'avoid'}">${z.a.grade} · ${z.a.score}/100</span></div><div>מחיר ${fmt(z.a.p)} · ${phase(z.a.phase)}</div><div>אזור עבודה ${fmt(z.a.workLow)}–${fmt(z.a.workHigh)} · מוקדמת ${fmt(z.a.early)}</div><div>Trigger A+ ${fmt(z.a.trigger)} · Hard SL ${fmt(z.a.initial)} · Trail ${fmt(z.a.trail)}</div><button class="tab topAnalyze" data-s="${z.x.symbol}">פתח ניתוח מלא</button></div>`).join('')}</div>`;document.querySelectorAll('.topAnalyze').forEach(x=>x.onclick=()=>deepAnalyze(x.dataset.s,true));$('global').innerHTML=`סריקה הושלמה ${new Date(j.fetchedAt).toLocaleTimeString('he-IL')} · סקטור מוביל: <b>${hot.sector}</b>`}catch(e){$('global').innerHTML=`<span class="avoid">סריקה נכשלה: ${e.message}</span>`}finally{b.disabled=false}}
$('refresh').onclick=refresh;$('scan').onclick=scanMarket;$('analyze').onclick=()=>deepAnalyze($('symbol').value,true);$('symbol').onkeydown=e=>{if(e.key==='Enter')deepAnalyze($('symbol').value,true)};document.querySelectorAll('.tab[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-p]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.portfolio').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});drawPortfolios();drawTrades();refresh();</script></body></html>
