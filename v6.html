<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum Intelligence v7</title><style>:root{--bg:#06101d;--c:#0d2035;--l:#315579;--t:#f7fbff;--m:#b7cade;--g:#68e7b5;--y:#ffd66b;--r:#ff8b98;--b:#66b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}header,main{padding:12px}header{background:#091726;border-bottom:1px solid var(--l)}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:13px;margin:10px 0}.grid,.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metrics{grid-template-columns:repeat(4,1fr)}.k,.pattern{background:#081827;border-radius:9px;padding:9px;border:1px solid #193b59}.k small{display:block;color:var(--m)}.btn,.field{padding:11px;border:1px solid var(--l);border-radius:9px;background:#0a2740;color:var(--t);width:100%}.primary{background:#1b4c76}.row{display:flex;justify-content:space-between;gap:10px}.mut{color:var(--m)}.buy{color:var(--g)}.wait{color:var(--y)}.sell{color:var(--r)}.score{font-size:27px;color:var(--b);font-weight:800}.decision{font-size:20px;font-weight:800}.why{line-height:1.55;border-right:4px solid var(--b);padding:10px;background:#081827}.holding{display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px;padding:8px;border-bottom:1px solid #23415f}.ok{border-color:#2d8664}.warn{border-color:#8b6e2e}.bad{border-color:#8b3946}.fresh{font-size:12px;color:var(--m)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.holding{grid-template-columns:1fr 1fr}.holding b{grid-column:1/-1}}</style></head><body><header><h2>Momentum Intelligence v7 🧠</h2><div class="mut">Price Action · Pattern Engine · Technical / Catalyst Signals · Position Manager</div></header><main><div class="grid"><button id="refresh" class="btn primary">↻ רענון נתונים חיים</button><button id="scan" class="btn">⚡ סריקת שוק</button></div><div id="status" class="card">Technical ו-Catalyst הם מנועים עצמאיים. חדשות אינן תנאי ל-Technical A/A+.</div><div id="scanOut"></div><div class="card"><h3>הפוזיציות שלנו</h3><div id="holdings"></div></div><div class="card"><div class="grid"><input id="symbol" class="field" value="MSTR"><button id="go" class="btn primary">נתח Price Action</button></div><div id="fresh" class="fresh"></div></div><div id="out"></div></main><script>
const PF={MSTR:{qty:79,avg:106.68},BMNR:{qty:210,avg:19.41},NVDA:{avg:207.38},AVGO:{avg:408.78},ONDS:{avg:9.07},SOFI:{avg:18.45},NOK:{avg:12.20},ETHA:{avg:14.22},IREN:{avg:36.56},GOOG:{avg:366.24},ORCL:{avg:137.23},MU:{avg:929.58},MRVL:{avg:224}};const Q={},$=x=>document.getElementById(x),fmt=n=>Number.isFinite(n)?'$'+n.toFixed(2):'—',pct=n=>Number.isFinite(n)?n.toFixed(1)+'%':'—';function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function sma(a,n){return a.length>=n?avg(a.slice(-n)):null}function ATR(c,n=14){let a=c.slice(-n-1),t=a.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-a[i-1].close),Math.abs(x.low-a[i-1].close)):x.high-x.low);return avg(t.slice(-n))}function RSI(v,n=14){if(v.length<n+1)return null;let g=0,l=0;for(let i=v.length-n;i<v.length;i++){let d=v[i]-v[i-1];d>0?g+=d:l-=d}return 100-100/(1+(g/n)/((l/n)||1e-9))}
async function quote(s){let r=await fetch('/api/quotes?symbols='+encodeURIComponent(s),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'quote');(j.quotes||[]).forEach(x=>Q[x.symbol]=x);return Q[s]}async function hist(s,range='2y',interval='1d'){let r=await fetch(`/api/history?symbol=${s}&range=${range}&interval=${interval}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.candles?.length)throw Error(j.error||'history');return j.candles}
function patterns(c){let p=c.at(-1).close,A=ATR(c)||p*.04,rv=(c.at(-1).volume||0)/(avg(c.slice(-21,-1).map(x=>x.volume||0))||1),o=[];let h=c.slice(-12),rg=Math.max(...h.map(x=>x.high))-Math.min(...h.map(x=>x.low)),prior=c.at(-13)?.close||p;if(rg/p<.09&&p>prior*1.06)o.push({n:'Bull Flag / Tight Flag',conf:Math.min(95,68+rv*8),pivot:Math.max(...h.slice(0,-1).map(x=>x.high)),inv:Math.min(...h.map(x=>x.low)),why:'מהלך עולה חד ואחריו התכנסות צרה'});let d=c.slice(-32),f=Math.min(...d.slice(0,11).map(x=>x.low)),s=Math.min(...d.slice(21).map(x=>x.low));if(Math.abs(f-s)/p<.035&&Math.max(f,s)<p*.94)o.push({n:'Double Bottom',conf:80,pivot:Math.max(...d.slice(8,24).map(x=>x.high)),inv:Math.min(f,s)-.2*A,why:'שני שפלים דומים עם התאוששות ביניהם'});let z=c.slice(-90),left=Math.max(...z.slice(0,22).map(x=>x.high)),rim=Math.max(...z.slice(-24).map(x=>x.high)),bot=Math.min(...z.slice(20,68).map(x=>x.low)),depth=(Math.min(left,rim)-bot)/Math.min(left,rim);if(Math.abs(left-rim)/p<.07&&depth>.12&&depth<.45)o.push({n:'Cup / Rounded Base candidate',conf:76,pivot:Math.max(left,rim),inv:bot,why:'בסיס מעוגל וחזרה לשפה; מחפשים ידית/Volume'});let q=c.slice(-25),hs=q.map(x=>x.high),ls=q.map(x=>x.low);if(hs.at(-1)>hs[0]&&ls.at(-1)>ls[0])o.push({n:'Ascending Structure',conf:73,pivot:Math.max(...hs.slice(0,-1)),inv:Math.min(...ls.slice(-8)),why:'Higher High + Higher Low'});let hi=Math.max(...c.slice(-61,-1).map(x=>x.high));if(p>hi*.985)o.push({n:'Breakout / Retest Zone',conf:Math.min(96,72+rv*10),pivot:hi,inv:p-1.6*A,why:'בדיקת שיא 60 יום עם צורך בהחזקה'});return o.sort((a,b)=>b.conf-a.conf)}
function calc(c,q,pos){let cl=c.map(x=>x.close),p=q?.livePrice??q?.price??cl.at(-1),A=ATR(c)||p*.04,m20=sma(cl,20),m50=sma(cl,50),m150=sma(cl,150),m200=sma(cl,200),R=RSI(cl),rv=(c.at(-1).volume||0)/(avg(c.slice(-21,-1).map(x=>x.volume||0))||1),res=Math.max(...c.slice(-61,-1).map(x=>x.high)),sup=Math.min(...c.slice(-12).map(x=>x.low)),pat=patterns(c),best=pat[0],pivot=best?.pivot||Math.max(...c.slice(-12,-1).map(x=>x.high));let below=[m20,m50,m150,m200].filter(x=>x&&x<p),support=Math.max(...below,0),workLow=Math.max(sup,support||p-1.3*A),workHigh=Math.min(p+.25*A,pivot),trigger=Math.max(p,pivot)*1.003,invalid=Math.min(workLow-.35*A,p-1.8*A),trail=Math.max(Math.min(...c.slice(-5).map(x=>x.low))-.15*A,p-1.55*A),score=40,why=[];[m20,m50,m150,m200].forEach(m=>{if(m&&p>m)score+=7});if(R>50&&R<73){score+=8;why.push('RSI תומך')}if(rv>1.25){score+=10;why.push('Volume מאשר')}if(best){score+=Math.min(16,best.conf/6);why.push(best.n)}score=Math.min(99,Math.round(score));let action='WAIT — חכה ל-Retest/מבנה',cls='wait';if(p>=pivot*.995&&score>=75){action=pos?'HOLD / ADD רק באישור פריצה':'TECHNICAL A+ — ENTRY באישור';cls='buy'}else if(p>=workLow&&p<=workHigh*1.01&&score>=62){action=pos?'HOLD — ADD קטן אפשרי באזור העבודה':'TECHNICAL A — EARLY ENTRY';cls='wait'}if(R>78&&p>res*.99){action=pos?'PROTECT PROFIT — לא להוסיף ליד התנגדות':'WAIT — מתוח ליד התנגדות';cls='sell'}return{p,A,m20,m50,m150,m200,R,rv,res,pat,best,score,why,workLow,workHigh,trigger,invalid,trail,action,cls}}
function explain(s,a,pos){let x=[];if(a.cls==='buy')x.push(`המבנה מצדיק פעולה: ${a.best?.n||'פריצה'} עם RVOL ${a.rv.toFixed(2)}x.`);else if(a.cls==='wait')x.push(`לא לרדוף. מחפשים תגובת קונים באזור ${fmt(a.workLow)}–${fmt(a.workHigh)}.`);else x.push('המחיר מתוח/ליד התנגדות; בפוזיציה קיימת מגנים על הרווח לפני שמוסיפים.');x.push(`אישור המשך מקומי ${fmt(a.trigger)} — זה Trigger ולא יעד רחוק שמתחפש לכניסה.`);x.push(`מתחת ${fmt(a.invalid)} ה-setup נפסל. Trailing SL מועמד ${fmt(a.trail)} ועולה בלבד.`);if(pos)x.push(`אנחנו כבר מחזיקים ${pos.qty||''} ${s} בממוצע ${fmt(pos.avg)} (${pct((a.p-pos.avg)/pos.avg*100)}), לכן זו החלטת ניהול פוזיציה ולא כניסה מאפס.`);return x.join(' ')}
function render(s,a,pos){let ps=a.pat.length?a.pat.slice(0,4).map(x=>`<div class="pattern ${x.conf>=82?'ok':'warn'}"><b>${x.n}</b> · ${Math.round(x.conf)}% confidence<div class="mut">${x.why}<br>Pivot ${fmt(x.pivot)} · Invalidation ${fmt(x.inv)}</div></div>`).join(''):'<div class="pattern bad">לא זוהתה תבנית איכותית — NO PATTERN TRADE</div>';$('out').innerHTML=`<div class="card"><div class="row"><div><h2>${s} ${fmt(a.p)}</h2><div class="decision ${a.cls}">${a.action}</div></div><div class="score">${a.score}/100</div></div><div class="why">${explain(s,a,pos)}</div></div><div class="metrics"><div class="k"><small>אזור עבודה / Retest</small><b>${fmt(a.workLow)}–${fmt(a.workHigh)}</b></div><div class="k"><small>Confirmation / ADD</small><b>${fmt(a.trigger)}</b></div><div class="k"><small>Invalidation / Hard SL</small><b class="sell">${fmt(a.invalid)}</b></div><div class="k"><small>Trailing SL</small><b class="buy">${fmt(a.trail)}</b></div><div class="k"><small>Resistance 60D</small><b>${fmt(a.res)}</b></div><div class="k"><small>RSI / RVOL</small><b>${a.R?.toFixed(1)||'—'} / ${a.rv.toFixed(2)}x</b></div><div class="k"><small>SMA20 / 50</small><b>${fmt(a.m20)} / ${fmt(a.m50)}</b></div><div class="k"><small>SMA150 / 200</small><b>${fmt(a.m150)} / ${fmt(a.m200)}</b></div></div><div class="card"><h3>🧩 Pattern Engine</h3>${ps}</div><div class="card"><h3>📰 Catalyst Engine — עצמאי</h3><div class="mut">Technical A/A+ לא דורש חדשות. Catalyst A/A+ יכול להצדיק Event Trade בנפרד. כששני המנועים מסכימים יוצג Double Confirmation, אבל לא מחכים לזה.</div></div>`}
async function deep(s){s=s.toUpperCase();$('symbol').value=s;$('fresh').textContent='טוען Live + Daily + Weekly...';try{let[q,d]=await Promise.all([quote(s),hist(s)]),a=calc(d,q,PF[s]);render(s,a,PF[s]);$('fresh').textContent='עודכן '+new Date().toLocaleTimeString('he-IL')+' · '+(q?.phase||'regular').toUpperCase()}catch(e){$('fresh').innerHTML='<span class="sell">שגיאה: '+e.message+'</span>'}}
function draw(){$('holdings').innerHTML=Object.entries(PF).map(([s,p])=>{let q=Q[s],x=q?.livePrice??q?.price,pl=Number.isFinite(x)?(x-p.avg)/p.avg*100:null;return `<div class="holding"><b>${s}${p.qty?' · '+p.qty:''}</b><span>${fmt(x)}</span><span>${pct(pl)}</span><button class="btn quick" data-s="${s}">נתח</button></div>`}).join('');document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>deep(b.dataset.s))}
async function refresh(){let sy=Object.keys(PF);$('status').textContent='מרענן...';try{let r=await fetch('/api/quotes?symbols='+sy.join(','),{cache:'no-store'}),j=await r.json();(j.quotes||[]).forEach(x=>Q[x.symbol]=x);draw();$('status').textContent='עודכן '+new Date().toLocaleTimeString('he-IL')+' · כולל Pre/Regular/After כשהמקור מספק.'}catch(e){$('status').textContent='רענון נכשל: '+e.message}}
async function scan(){let b=$('scan');b.disabled=true;$('scanOut').innerHTML='<div class="card">סורק...</div>';try{let r=await fetch('/api/market-scan',{cache:'no-store'}),j=await r.json(),rows=(j.results||j.stocks||[]).slice(0,10);$('scanOut').innerHTML=`<div class="card"><h3>🔥 Market Scan</h3>${rows.length?rows.map((x,i)=>`<div class="holding"><b>#${i+1} ${x.symbol||x.ticker}</b><span>${x.sector||''}</span><span>${pct(x.changePercent)}</span><button class="btn pick" data-s="${x.symbol||x.ticker}">Pattern Scan</button></div>`).join(''):'אין תוצאות מה-API'}</div>`;document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>deep(x.dataset.s))}catch(e){$('scanOut').innerHTML='<div class="card sell">'+e.message+'</div>'}finally{b.disabled=false}}
$('go').onclick=()=>deep($('symbol').value);$('refresh').onclick=refresh;$('scan').onclick=scan;draw();refresh();deep('MSTR');</script></body></html>
