<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Command Center v6</title><style>
:root{--bg:#06101d;--card:#0d2035;--line:#315579;--txt:#f7fbff;--mut:#b7cade;--g:#68e7b5;--y:#ffd66b;--r:#ff8b98;--b:#66b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}header{padding:16px;position:sticky;top:0;background:#091726;border-bottom:1px solid var(--line);z-index:2}h1{margin:0}.mut{color:var(--mut)}main{padding:12px;max-width:1200px;margin:auto}.toolbar,.grid,.metrics{display:grid;gap:10px}.toolbar{grid-template-columns:2fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.field,.btn{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#081827;color:var(--txt)}.btn{cursor:pointer;background:#17456d}.score{font-size:24px;color:var(--b);font-weight:800}.buy{color:var(--g)}.wait{color:var(--y)}.avoid{color:var(--r)}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px}.reason{margin-top:8px;padding:8px;background:#081827;border-radius:8px}.guard{border-color:#8b3946}.ok{border-color:#2d8664}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#081827;color:var(--txt);cursor:pointer}.tab.active{background:#17456d}.portfolio{display:none}.portfolio.active{display:block}.holding{display:grid;grid-template-columns:1fr repeat(4,auto);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #23415f}.holding:last-child{border:0}.ticker{font-weight:800}.summary{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 12px}.summary b{font-size:18px}@media(max-width:760px){.grid,.toolbar{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.holding{grid-template-columns:1fr 1fr;gap:5px}.holding .ticker{grid-column:1/-1}}
</style></head><body><header><h1>Stock Command Center v6</h1><div class="mut">Daily + Weekly · SMA20/50/150/200 · Volume · ATR · Overhead Resistance Guard</div></header><main>
<div class="card"><b>התיקים שלי</b><div class="tabs"><button class="tab active" data-p="p1">תיק 1 · בנק/ברוקר</button><button class="tab" data-p="p2">תיק 2 · TradeStation</button></div>
<div id="p1" class="portfolio active"><div class="summary"><span>שווי ניירות: <b>$37.78K</b></span><span>מזומן: <b>$14.3K</b></span></div><div id="p1rows"></div></div>
<div id="p2" class="portfolio"><div class="summary"><span>שווי: <b>$38.68K</b></span><span>עלות: <b>$36.91K</b></span><span>Open P/L: <b class="buy">+$1.78K</b></span></div><div id="p2rows"></div></div></div>
<div class="toolbar" style="margin-top:12px"><input id="symbol" class="field" value="CRCL" placeholder="Ticker"><button id="go" class="btn">נתח עכשיו</button></div><div id="status" class="card" style="margin-top:10px">מוכן לניתוח.</div><div id="result" style="margin-top:10px"></div>
</main><script>
const portfolios={p1:[['SNDK',1260.47,1609,27.7],['SOFI',18.45,1818,-1.44],['NOK',12.20,2072,-15.1],['ETHU',19.43,2437,25.4],['ETHA',14.22,2837,25.4],['IREN',36.56,3050,19.2],['GOOG',366.24,3404,-7.06],['ORCL',137.23,3590,4.64],['MU',929.58,3938,5.91],['PURR',7.97,5174,29.9],['MRVL',224.00,7627,13.5]],p2:[['AVGO',408.78,5525.40,-9.89],['NVDA',207.38,16381.50,5.31],['MSTR',106.68,9535.45,13.14],['BMNR',19.41,4710.30,15.55],['ONDS',9.07,2526.03,-7.16]]};
function portfolioRows(id){document.getElementById(id+'rows').innerHTML=portfolios[id].map(x=>`<div class="holding"><span class="ticker">${x[0]}</span><span>ממוצע $${x[1].toFixed(2)}</span><span>שווי $${x[2].toLocaleString()}</span><span class="${x[3]>=0?'buy':'avoid'}">${x[3]>=0?'+':''}${x[3].toFixed(2)}%</span><button class="tab" onclick="analyzeTicker('${x[0]}')">נתח</button></div>`).join('')};portfolioRows('p1');portfolioRows('p2');document.querySelectorAll('.tab[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-p]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.portfolio').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});
const $=id=>document.getElementById(id),fmt=n=>Number.isFinite(n)?'$'+n.toFixed(2):'—',pct=n=>Number.isFinite(n)?n.toFixed(2)+'%':'—';function analyzeTicker(s){$('symbol').value=s;run();scrollTo({top:document.querySelector('.toolbar').offsetTop-80,behavior:'smooth'})}
function SMA(v,n){return v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n)}function EMA(v,n){const k=2/(n+1);let e=null;return v.map((x,i)=>{e=e==null?x:x*k+e*(1-k);return i<n-1?null:e})}function RSI(v,n=14){let g=0,l=0,o=Array(v.length).fill(null);for(let i=1;i<=n&&i<v.length;i++){let d=v[i]-v[i-1];d>=0?g+=d:l-=d}let ag=g/n,al=l/n;for(let i=n;i<v.length;i++){if(i>n){let d=v[i]-v[i-1];ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n}o[i]=100-100/(1+ag/(al||1e-9))}return o}function ATR(c,n=14){const tr=c.map((x,i)=>i?Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)):x.high-x.low);return SMA(tr,n)}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}async function hist(s,range='2y',interval='1d'){const r=await fetch(`/api/history?symbol=${encodeURIComponent(s)}&range=${range}&interval=${interval}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.candles?.length)throw Error(j.error||'no data');return j.candles}
function analyze(c,w){const cl=c.map(x=>x.close),last=c.at(-1),p=last.close;const s20=SMA(cl,20).at(-1),s50=SMA(cl,50).at(-1),s150=SMA(cl,150).at(-1),s200=SMA(cl,200).at(-1),e20=EMA(cl,20).at(-1),rsi=RSI(cl).at(-1),atr=ATR(c).at(-1);const prev=c.slice(-61,-1),res=Math.max(...prev.map(x=>x.high)),sup=Math.min(...c.slice(-20).map(x=>x.low));const avgv=avg(c.slice(-21,-1).map(x=>x.volume||0)),rv=avgv?last.volume/avgv:null;const wc=w.map(x=>x.close),wp=w.at(-1).close,ws20=SMA(wc,20).at(-1),ws50=SMA(wc,50).at(-1);const overhead=[['SMA20',s20],['SMA50',s50],['SMA150',s150],['SMA200',s200],['60D High',res]].filter(([,v])=>Number.isFinite(v)&&v>p).map(([n,v])=>({n,v,d:(v-p)/p*100})).sort((a,b)=>a.d-b.d);const blocker=overhead.find(x=>x.d<=3);const breakout=p>res&&rv>=1.25;const trend=[s20,s50,s150,s200].filter(Number.isFinite).filter(x=>p>x).length;let score=45,reasons=[];score+=trend*7;if(rsi>=50&&rsi<=70){score+=8;reasons.push('RSI חיובי')}if(rsi>75){score-=10;reasons.push('RSI מתוח')}if(rv>=1.25){score+=8;reasons.push('ווליום מאשר')}if(wp>ws20){score+=7;reasons.push('שבועי מעל SMA20')}if(ws50&&wp>ws50)score+=5;if(blocker){score-=25;reasons.push(`חסם ${blocker.n} רק ${blocker.d.toFixed(1)}% מעל המחיר`)}if(breakout){score+=10;reasons.push('פריצת 60 יום עם ווליום')}score=Math.max(0,Math.min(100,score));let action='WAIT / CONFIRM',cls='wait';if(score>=78&&!blocker&&(breakout||p>s20&&p>s50)){action='ENTRY QUALITY';cls='buy'}if(score<50){action='NO ENTRY';cls='avoid'}const stop=Math.max(sup,p-1.5*(atr||p*.04)),risk=p-stop,t1=p+2*risk,t2=p+3*risk;return {p,s20,s50,s150,s200,e20,rsi,atr,res,sup,rv,ws20,ws50,blocker,score,reasons,action,cls,stop,t1,t2,overhead}}
function render(s,a){const block=a.blocker?`<div class="card guard"><b class="avoid">⛔ Overhead guard</b><div>${a.blocker.n} ב-${fmt(a.blocker.v)} — רק ${pct(a.blocker.d)} מעל המחיר. אין BUY לפני פריצה + החזקה/Retest.</div></div>`:`<div class="card ok"><b class="buy">✓ אין חסם משמעותי עד 3% מעל המחיר</b></div>`;const mas=[['SMA20',a.s20],['SMA50',a.s50],['SMA150',a.s150],['SMA200',a.s200]].map(([n,v])=>`<div class="card"><span class="mut">${n}</span><b style="display:block">${fmt(v)}</b><span class="${a.p>v?'buy':'avoid'}">${a.p>v?'מעל':'מתחת'}</span></div>`).join('');$('result').innerHTML=`<div class="grid"><div class="card"><div class="row"><div><h2 style="margin:0">${s}</h2><div>${fmt(a.p)}</div></div><div><div class="score">${a.score}/100</div><span class="pill ${a.cls}">${a.action}</span></div></div><div class="reason">${a.reasons.join(' · ')||'אין אישור מספיק'}</div></div>${block}</div><div class="metrics" style="margin-top:10px">${mas}</div><div class="grid" style="margin-top:10px"><div class="card"><b>מומנטום</b><div>RSI14: ${a.rsi?.toFixed(1)||'—'}</div><div>Relative Volume: ${a.rv?.toFixed(2)||'—'}x</div><div>ATR14: ${fmt(a.atr)}</div></div><div class="card"><b>תכנית סיכון</b><div>Support: ${fmt(a.sup)}</div><div>Resistance 60D: ${fmt(a.res)}</div><div>SL context: ${fmt(a.stop)}</div><div>T1: ${fmt(a.t1)} · T2: ${fmt(a.t2)}</div></div><div class="card"><b>שבועי</b><div>SMA20W: ${fmt(a.ws20)}</div><div>SMA50W: ${fmt(a.ws50)}</div></div><div class="card"><b>הכלל החדש</b><div>BUY נחסם אוטומטית כש-MA משמעותי או שיא 60 יום נמצאים עד 3% מעל המחיר.</div></div></div>`}async function run(){const s=($('symbol').value||'').trim().toUpperCase();if(!s)return;$('status').textContent='טוען יומי + שבועי...';try{const [d,w]=await Promise.all([hist(s,'2y','1d'),hist(s,'5y','1wk')]);const a=analyze(d,w);render(s,a);$('status').innerHTML=`עודכן עכשיו · ${d.length} נרות יומיים + ${w.length} שבועיים · SMA200 מחושב מנתונים אמיתיים`;}catch(e){$('status').innerHTML=`<span class="avoid">שגיאה: ${e.message}</span>`}}$('go').onclick=run;$('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')run()});run();
</script></body></html>
